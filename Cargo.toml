[package]
name = "myagentrust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid","tls-rustls-ring-webpki"]}
uuid = { version = "1.26.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
solana-sdk = "4.0.1"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
getrandom = "0.4.3"
hex = "0.4.3"
base64 = "0.22"
ed25519-dalek = "2.2"
solana-client = "4.3.0"
borsh = { version = "1.8.1", features = ["derive"] }
sha2 = "0.10"
bincode = "1.3"
solana-transaction-status-client-types = "4.3.0"
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
serde_json = "1.0"
tower = { version = "0.5.3", features = ["util"] }
