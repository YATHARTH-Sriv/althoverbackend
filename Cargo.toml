[package]
name = "myagentrust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid"]}
uuid = { version = "1.26.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
solana-sdk = "5.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
base64 = "0.22"
ed25519-dalek = "2.2"

[dev-dependencies]
serde_json = "1.0"
tower = { version = "0.5.3", features = ["util"] }
